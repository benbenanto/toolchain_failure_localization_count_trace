[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "benbenanto-toolchain_failure_localization_count_trace"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出模型评测平台工程师·多轮工具链的失败定位上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "benbenanto" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://benbenanto.github.io"
Repository = "https://github.com/benbenanto/toolchain_failure_localization_count_trace"
Issues = "https://github.com/benbenanto/toolchain_failure_localization_count_trace/issues"

[project.scripts]
toolchain_failure_localization_count_trace = "toolchain_failure_localization_count_trace:main"

[tool.setuptools]
py-modules = ["toolchain_failure_localization_count_trace"]
